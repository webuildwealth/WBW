<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Finanz-Medizin Split-Screen Engine</title>
<style>
/* Markenschriften liegen lokal in ../assets/fonts (Variable Fonts, OFL). */
@font-face{font-family:'Manrope';font-weight:200 800;src:url('../assets/fonts/manrope-normal-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-weight:200 800;src:url('../assets/fonts/manrope-normal-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Inter';font-weight:100 900;src:url('../assets/fonts/inter-normal-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Newsreader';font-style:italic;font-weight:200 800;src:url('../assets/fonts/newsreader-italic-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --navy-900:#071B32;--navy-800:#0C2C4F;--navy-700:#11395F;--navy-600:#17486F;--navy-500:#1E5A88;--navy-300:#6F93B4;--navy-100:#D6E1EC;--navy-050:#EDF2F7;
  --red-700:#751524;--red-600:#8C1E2F;--red-500:#A5293B;--red-100:#F1DDE0;--red-050:#FAF0F1;
  --ivory:#F4F0EF;--bone:#E3DCD6;--ink-soft:#3D5064;--green-700:#17683F;--green-050:#E4F3EA;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;overflow:hidden}
#stage{position:relative;width:1080px;height:960px;overflow:hidden;font-family:'Manrope','Inter',sans-serif;color:var(--navy-800)}
#panel{position:absolute;left:0;top:0;width:1080px;height:960px;overflow:hidden;
  background-color:var(--ivory);
  background-image:linear-gradient(rgba(12,44,79,.055) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(12,44,79,.055) 1.5px,transparent 1.5px);
  background-size:54px 54px}
.scene{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform,opacity}
.abs{position:absolute}
.hl{font-weight:800;letter-spacing:-.02em}
.serif{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:500;letter-spacing:-.01em}
#divider{position:absolute;left:0;width:1080px;height:10px;background:var(--navy-800);z-index:50}
#divider i{position:absolute;left:0;top:0;height:10px;background:var(--red-500);display:block}
#subs{position:absolute;left:0;width:1080px;text-align:center;z-index:40;font-weight:800;letter-spacing:-.02em;line-height:1.05;
  -webkit-text-stroke:0;paint-order:stroke fill}
#subs{padding:0 120px;box-sizing:border-box}
#subs span{display:inline-block;margin:0 .16em;white-space:nowrap}
#brand{position:absolute;z-index:45;width:70px;height:70px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(7,27,50,.25)}
#brand img{width:100%;height:100%;object-fit:contain;border-radius:50%}
</style>
</head>
<body>
<div id="stage">
  <div id="panel"></div>
  <div id="subs"></div>
  <div id="divider"><i></i></div>
  <div id="brand"><img id="brandimg" alt=""></div>
</div>
<script src="engine.js"></script>
</body>
</html>
