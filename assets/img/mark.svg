    </g>

    <!-- Knauf des Stabes -->
    <circle cx="44.6" cy="21.8" r="4.3" fill="url(#fmRod)"
            stroke="#2E3A46" stroke-opacity=".32" stroke-width=".9"/>
    <ellipse cx="43.2" cy="20.2" rx="1.6" ry="1.2" fill="#FFFFFF" opacity=".8"/>

    <!-- Schlangenkopf: nach vorn verjuengte Schnauze, Auge oben vorn -->
    <g transform="translate(55.96 31.20) rotate(20)">
      <path d="M-5.6 -1.4 C-3.4 -3.9 1.4 -4.1 4.6 -2.2
               C6.3 -1.2 6.4 1.1 4.4 2.0
               C1.2 3.5 -3.4 3.3 -5.6 1.6 Z"
            fill="url(#fmBone)" stroke="#2E3A46" stroke-opacity=".32" stroke-width=".9"
            stroke-linejoin="round"/>
      <ellipse cx="-1.6" cy="-1.9" rx="2.4" ry=".85" fill="#FFFFFF" opacity=".7"/>
      <circle cx="1.9" cy="-1.15" r=".95" fill="#12244A"/>
    </g>

  </g>
</svg>
