  <!-- Knauf des Stabes -->
  <circle cx="43.4" cy="21.0" r="3.9" fill="url(#fmRod)"
          stroke="#41505E" stroke-opacity=".42" stroke-width=".9"/>

  <!-- Schlangenkopf mit Auge, nach rechts gerichtet -->
  <g transform="rotate(18 53.34 31.50)">
    <ellipse cx="53.34" cy="31.50" rx="5.3" ry="3.4" fill="url(#fmBone)"
             stroke="#41505E" stroke-opacity=".42" stroke-width=".9"/>
  </g>
  <circle cx="54.14" cy="30.10" r=".85" fill="#12365F"/>
</svg>
