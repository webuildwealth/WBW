<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="Finanz-Medizin">
  <title>Finanz-Medizin</title>
  <defs>
    <linearGradient id="fmNavy" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#2C5A93"/>
      <stop offset=".38" stop-color="#12365F"/>
      <stop offset="1" stop-color="#08203A"/>
    </linearGradient>
    <linearGradient id="fmRed" x1=".9" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#B33244"/>
      <stop offset=".38" stop-color="#8E1F30"/>
      <stop offset="1" stop-color="#5D1019"/>
    </linearGradient>
    <linearGradient id="fmBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B33244"/>
      <stop offset=".42" stop-color="#8E1F30"/>
      <stop offset="1" stop-color="#63111C"/>
    </linearGradient>
    <!-- Gemeinsames Licht ueber die ganze Marke -->
    <linearGradient id="fmBone" gradientUnits="userSpaceOnUse" x1="30" y1="20" x2="56" y2="86">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#F7F4F1"/>
      <stop offset="1" stop-color="#DDD5CE"/>
    </linearGradient>
    <!-- Zylinder-Schattierung quer zum Stab -->
    <linearGradient id="fmRod" gradientUnits="userSpaceOnUse" x1="40.4" y1="0" x2="46.4" y2="0">
      <stop offset="0" stop-color="#E3DBD4"/>
      <stop offset=".34" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CCC3BC"/>
    </linearGradient>
  </defs>

  <!-- Ring: linke Haelfte navy, rechte Haelfte bordeaux, oben und unten
       durch eine schmale Fuge getrennt. Stumpfe Enden wie in der Vorlage. -->
  <g fill="none" stroke-linecap="butt">
    <path d="M48.74 12.02 A36 36 0 1 0 48.74 83.98" stroke="url(#fmNavy)" stroke-width="6.5"/>
    <path d="M51.26 12.02 A36 36 0 1 1 51.26 83.98" stroke="url(#fmRed)" stroke-width="6.5"/>
  </g>

  <!-- Balken: aufsteigend, der hoechste laeuft in den roten Bogen hinein -->
  <g>
    <rect x="46.8" y="63.8" width="6.4" height="17"   rx="1" fill="url(#fmBar)"/>
    <rect x="55.7" y="49.3" width="6.7" height="31.5" rx="1" fill="url(#fmBar)"/>
    <rect x="64.5" y="38.9" width="7.6" height="38.1" rx="1" fill="url(#fmBar)"/>
    <g fill="#FFFFFF" opacity=".2">
      <rect x="47.6" y="64.7" width="1.6" height="15.2" rx=".8"/>
      <rect x="56.5" y="50.2" width="1.7" height="29.7" rx=".85"/>
      <rect x="65.3" y="39.8" width="1.9" height="36.3" rx=".95"/>
    </g>
  </g>

