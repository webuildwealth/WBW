<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Finanz-Medizin">
  <title>Finanz-Medizin</title>
  <defs>
    <linearGradient id="fmNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22508A"/>
      <stop offset=".55" stop-color="#0C2C4F"/>
      <stop offset="1" stop-color="#071B32"/>
    </linearGradient>
    <linearGradient id="fmRed" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AE2E41"/>
      <stop offset=".55" stop-color="#8C1E2F"/>
      <stop offset="1" stop-color="#5A0F1B"/>
    </linearGradient>
    <linearGradient id="fmBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AE2E41"/>
      <stop offset=".5" stop-color="#8C1E2F"/>
      <stop offset="1" stop-color="#63111E"/>
    </linearGradient>
    <!-- Gemeinsames Licht ueber die ganze Marke: userSpaceOnUse, damit
         Stab, Schlange und Knauf dieselbe Lichtrichtung teilen. -->
    <linearGradient id="fmBone" gradientUnits="userSpaceOnUse" x1="28" y1="18" x2="58" y2="82">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#F8F5F3"/>
      <stop offset="1" stop-color="#DED6D0"/>
    </linearGradient>
    <!-- Der Stab bekommt eine Zylinder-Schattierung quer zur Achse -->
    <linearGradient id="fmRod" gradientUnits="userSpaceOnUse" x1="40.8" y1="0" x2="47.2" y2="0">
      <stop offset="0" stop-color="#E6DFD9"/>
      <stop offset=".34" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFC7C1"/>
    </linearGradient>
  </defs>

  <!-- Ring: linke Haelfte navy, rechte Haelfte bordeaux, oben und unten
       durch eine schmale Fuge getrennt (wie in der Bildvorlage). -->
  <g fill="none" stroke-linecap="round">
    <path d="M46.9 12.1 A36 36 0 1 0 46.9 83.9" stroke="url(#fmNavy)" stroke-width="9.5"/>
    <path d="M53.1 12.1 A36 36 0 1 1 53.1 83.9" stroke="url(#fmRed)" stroke-width="9.5"/>
  </g>

  <!-- Balken: Vermoegensaufbau, aufsteigend. Der hoechste laeuft bewusst in
       den roten Bogen hinein, genau wie in der Vorlage. -->
  <g>
    <rect x="54" y="55" width="7.5" height="16" rx="2.2" fill="url(#fmBar)"/>
    <rect x="64.5" y="46" width="7.5" height="25" rx="2.2" fill="url(#fmBar)"/>
    <rect x="75" y="37" width="7.5" height="34" rx="2.2" fill="url(#fmBar)"/>
    <g fill="#FFFFFF" opacity=".18">
      <rect x="54.9" y="56" width="2" height="14" rx="1"/>
      <rect x="65.4" y="47" width="2" height="23" rx="1"/>
      <rect x="75.9" y="38" width="2" height="32" rx="1"/>
    </g>
  </g>

  <!-- Aeskulapstab mit Schlange. Schmale dunkle Kontur, damit die helle
       Deckflaeche traegt — auf hellem wie auf dunklem Grund. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 15 V83" stroke="#3E4A57" stroke-opacity=".55" stroke-width="7.7"/>
    <path d="M44 15 V83" stroke="url(#fmRod)" stroke-width="6.4"/>

    <path d="M34.5 77.5 C28 73.8 29.6 67.6 40.5 64.8 C52.4 61.8 54.2 55.2 44 51.4
             C33.4 47.4 34.6 40.4 45 37.4 C52.4 35 54.2 31.6 51.4 28.8"
          stroke="#3E4A57" stroke-opacity=".55" stroke-width="7.7"/>
    <path d="M34.5 77.5 C28 73.8 29.6 67.6 40.5 64.8 C52.4 61.8 54.2 55.2 44 51.4
             C33.4 47.4 34.6 40.4 45 37.4 C52.4 35 54.2 31.6 51.4 28.8"
          stroke="url(#fmBone)" stroke-width="6.4"/>
  </g>

  <!-- Knauf des Stabes und Schlangenkopf mit Auge -->
  <circle cx="44" cy="14.6" r="5.4" fill="url(#fmRod)" stroke="#3E4A57" stroke-opacity=".55" stroke-width="1.2"/>
  <g transform="rotate(-42 52.2 26.4)">
    <ellipse cx="52.2" cy="26.4" rx="4.5" ry="3.5" fill="url(#fmBone)"
             stroke="#3E4A57" stroke-opacity=".5" stroke-width="1.1"/>
  </g>
  <circle cx="53.4" cy="25.1" r=".9" fill="#0C2C4F"/>
</svg>
