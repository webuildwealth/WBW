<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="Finanz-Medizin">
  <title>Finanz-Medizin</title>
  <defs>
    <linearGradient id="fmNavy" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#3A6CC0"/>
      <stop offset=".3" stop-color="#20489A"/>
      <stop offset=".68" stop-color="#173876"/>
      <stop offset="1" stop-color="#0E2350"/>
    </linearGradient>
    <linearGradient id="fmRed" x1=".9" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#E23B52"/>
      <stop offset=".3" stop-color="#CA1934"/>
      <stop offset=".68" stop-color="#A81028"/>
      <stop offset="1" stop-color="#79091B"/>
    </linearGradient>
    <linearGradient id="fmBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A81028"/>
      <stop offset=".18" stop-color="#DC3149"/>
      <stop offset=".6" stop-color="#C41630"/>
      <stop offset="1" stop-color="#82091D"/>
    </linearGradient>
    <!-- Gemeinsames Licht ueber die ganze Marke -->
    <linearGradient id="fmBone" gradientUnits="userSpaceOnUse" x1="32" y1="20" x2="58" y2="88">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".42" stop-color="#F8F5F3"/>
      <stop offset="1" stop-color="#D9D1CA"/>
    </linearGradient>
    <!-- Zylinder-Schattierung quer zum Stab -->
    <linearGradient id="fmRod" gradientUnits="userSpaceOnUse" x1="41.2" y1="0" x2="48" y2="0">
      <stop offset="0" stop-color="#DCD4CD"/>
      <stop offset=".3" stop-color="#FFFFFF"/>
      <stop offset=".72" stop-color="#EFEAE6"/>
      <stop offset="1" stop-color="#C5BCB5"/>
    </linearGradient>
    <linearGradient id="fmGloss" gradientUnits="userSpaceOnUse" x1="32" y1="22" x2="58" y2="86">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <!-- Plastisches Relief wie im Vorlagenbild -->
    <filter id="fmRelief" x="-12%" y="-12%" width="128%" height="128%">
      <feDropShadow dx=".5" dy="1" stdDeviation=".9" flood-color="#0A1622" flood-opacity=".26"/>
    </filter>
  </defs>

  <g filter="url(#fmRelief)">

    <!-- Ring: linke Haelfte navy, rechte Haelfte bordeaux. Die Fuge sitzt
         oben ueber dem Stab, die Enden sind stumpf geschnitten. -->
    <g fill="none" stroke-linecap="butt">
      <path d="M41.29 13.07 A36 36 0 0 0 39.47 82.42" stroke="url(#fmNavy)" stroke-width="8"/>
      <path d="M49.37 12.01 A36 36 0 0 1 54.38 83.73" stroke="url(#fmRed)" stroke-width="8"/>
      <!-- Glanzkante aussen, Schattenkante innen -->
      <path d="M38.9 14.2 A38.4 38.4 0 0 0 12.2 51.5" stroke="#8FB6E4" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M52.4 12.4 A38.4 38.4 0 0 1 86.9 46.0" stroke="#F5A2AE" stroke-opacity=".5" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M43.6 15.6 A32.8 32.8 0 0 0 41.6 79.4" stroke="#07132A" stroke-opacity=".28" stroke-width="1.3"/>
      <path d="M50.9 14.9 A32.8 32.8 0 0 1 55.9 80.2" stroke="#4A0512" stroke-opacity=".26" stroke-width="1.3"/>
    </g>

    <!-- Balken: aufsteigend im rechten Ringinneren, auf gemeinsamer
         Standlinie. Der hoechste verschmilzt unten rechts mit dem Bogen. -->
    <g>
      <rect x="49.5" y="66" width="7.4" height="14" rx="1" fill="url(#fmBar)"/>
      <rect x="57.8" y="57" width="7.8" height="23" rx="1" fill="url(#fmBar)"/>
      <rect x="66.6" y="43" width="8.6" height="37" rx="1" fill="url(#fmBar)"/>
      <g fill="#FFFFFF" opacity=".26">
        <rect x="49.5" y="66" width="7.4" height="1.4" rx=".7"/>
        <rect x="57.8" y="57" width="7.8" height="1.4" rx=".7"/>
        <rect x="66.6" y="43" width="8.6" height="1.4" rx=".7"/>
      </g>
      <g fill="#FFFFFF" opacity=".22">
        <rect x="50.4" y="67.2" width="1.7" height="11.6" rx=".85"/>
        <rect x="58.7" y="58.2" width="1.8" height="20.6" rx=".9"/>
        <rect x="67.5" y="44.2" width="1.9" height="34.6" rx=".95"/>
      </g>
    </g>

