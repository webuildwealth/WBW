        <path d="M35.24 65.00 C35.26 64.85 35.23 64.39 35.34 64.08 C35.45 63.78 35.63 63.47 35.90 63.17 C36.16 62.86 36.50 62.56 36.93 62.25 C37.36 61.94 37.85 61.64 38.47 61.33 C39.09 61.03 39.62 60.72 40.64 60.42 C41.66 60.11 43.27 59.81 44.60 59.50 C45.93 59.19 47.58 58.89 48.64 58.58 C49.71 58.28 50.30 57.97 50.98 57.67 C51.67 57.36 52.24 57.06 52.75 56.75 C53.26 56.44 53.68 56.14 54.03 55.83 C54.37 55.53 54.64 55.22 54.82 54.92 C55.01 54.61 55.08 54.15 55.13 54.00" stroke="url(#fmGloss)" stroke-width="1.7" stroke-opacity=".55"/>
        <path d="M34.07 43.00 C34.12 42.85 34.19 42.39 34.38 42.08 C34.56 41.78 34.83 41.47 35.17 41.17 C35.52 40.86 35.94 40.56 36.45 40.25 C36.96 39.94 37.53 39.64 38.22 39.33 C38.90 39.03 39.49 38.72 40.56 38.42 C41.62 38.11 43.27 37.81 44.60 37.50 C45.93 37.19 47.54 36.89 48.56 36.58 C49.58 36.28 50.11 35.97 50.73 35.67 C51.35 35.36 51.84 35.06 52.27 34.75 C52.70 34.44 53.04 34.14 53.30 33.83 C53.57 33.53 53.75 33.22 53.86 32.92 C53.97 32.61 53.94 32.15 53.96 32.00" stroke="url(#fmGloss)" stroke-width="1.7" stroke-opacity=".55"/>
