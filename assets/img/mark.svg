<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Finanz-Medizin">
  <title>Finanz-Medizin</title>
  <!--
    Bildmarke nach Vorlage: offener Ring (navy links, bordeaux rechts) mit
    Lücke oben, Äskulapstab mit gewundener Schlange, drei aufsteigende Balken.
    Bewusst flach vektorisiert statt als 3D-Render — die Marke steht in der
    Kopfzeile bei 38px und auf hellem wie dunklem Grund; eingebackene Lichter
    eines Renders würden dort absaufen.

    Strichstärken sind aus der Vorlage abgeleitet: Ring rund 8,5 % des
    Ringdurchmessers, Stab und Schlange rund 6 %.
  -->
  <defs>
    <path id="fm-stab" d="M41 16 V88"/>
    <path id="fm-schlange"
          d="M32 77 C50 73 51 65 41 61 C31 57 30 49 41 45 C52 41 51 34 43 30"/>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ring: zwei Bögen, Lücke oben 14°, unten 6° -->
    <path d="M45.5 13.5 A37 37 0 0 0 48.1 87.0" stroke="#0C2C4F" stroke-width="7.5"/>
    <path d="M54.5 13.5 A37 37 0 0 1 51.9 87.0" stroke="#751524" stroke-width="7.5"/>

    <!-- Balken: Vermögensaufbau, rechts vom Stab, aufsteigend -->
    <g stroke="none" fill="#751524">
      <rect x="55" y="56" width="7" height="16" rx="2"/>
      <rect x="64.5" y="47" width="7" height="25" rx="2"/>
      <rect x="74" y="37" width="7" height="35" rx="2"/>
    </g>

    <!-- Stab und Schlange: dunkle Kontur, darüber helle Deckfläche -->
    <use href="#fm-stab" stroke="#0C2C4F" stroke-width="8.6"/>
    <use href="#fm-schlange" stroke="#0C2C4F" stroke-width="8.6"/>
    <use href="#fm-stab" stroke="#F4F0EF" stroke-width="5.2"/>
    <use href="#fm-schlange" stroke="#F4F0EF" stroke-width="5.2"/>

    <!-- Kopf: kurze Verlängerung nach rechts, mit Auge -->
    <path id="fm-kopf" d="M43 30 C46.5 28 49 28.5 50 30.8" stroke="#0C2C4F" stroke-width="8.6"/>
    <path d="M43 30 C46.5 28 49 28.5 50 30.8" stroke="#F4F0EF" stroke-width="5.2"/>
    <circle cx="47.9" cy="29.4" r="1.05" fill="#0C2C4F" stroke="none"/>

    <!-- Knauf -->
    <circle cx="41" cy="13.6" r="5.6" fill="#F4F0EF" stroke="#0C2C4F" stroke-width="2.6"/>
  </g>
</svg>
