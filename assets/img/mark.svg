      <path d="M55.13 54.00 C55.10 53.85 55.09 53.39 54.94 53.08 C54.79 52.78 54.56 52.47 54.24 52.17 C53.92 51.86 53.52 51.56 53.03 51.25 C52.53 50.94 51.97 50.64 51.27 50.33 C50.58 50.03 49.98 49.72 48.87 49.42 C47.76 49.11 46.02 48.81 44.60 48.50 C43.18 48.19 41.44 47.89 40.33 47.58 C39.22 47.28 38.62 46.97 37.93 46.67 C37.23 46.36 36.67 46.06 36.17 45.75 C35.68 45.44 35.28 45.14 34.96 44.83 C34.64 44.53 34.41 44.22 34.26 43.92 C34.11 43.61 34.10 43.15 34.07 43.00" stroke="url(#fmBone)" stroke-width="6.75"/>
      <g transform="translate(-.8 -.8)">
        <path d="M44.30 70.48 C43.95 70.40 42.77 70.17 42.19 70.02 C41.61 69.87 41.23 69.72 40.82 69.56 C40.40 69.41 40.04 69.26 39.69 69.11 C39.34 68.96 39.03 68.80 38.73 68.65 C38.43 68.50 38.16 68.35 37.90 68.20 C37.64 68.04 37.41 67.89 37.19 67.74 C36.97 67.59 36.77 67.43 36.59 67.28 C36.41 67.13 36.25 66.98 36.11 66.83 C35.96 66.67 35.83 66.52 35.73 66.37 C35.62 66.22 35.53 66.07 35.46 65.91 C35.38 65.76 35.33 65.61 35.29 65.46 C35.26 65.30 35.25 65.08 35.24 65.00" stroke="url(#fmGloss)" stroke-width="1.7" stroke-opacity=".55"/>
        <path d="M55.13 54.00 C55.10 53.85 55.09 53.39 54.94 53.08 C54.79 52.78 54.56 52.47 54.24 52.17 C53.92 51.86 53.52 51.56 53.03 51.25 C52.53 50.94 51.97 50.64 51.27 50.33 C50.58 50.03 49.98 49.72 48.87 49.42 C47.76 49.11 46.02 48.81 44.60 48.50 C43.18 48.19 41.44 47.89 40.33 47.58 C39.22 47.28 38.62 46.97 37.93 46.67 C37.23 46.36 36.67 46.06 36.17 45.75 C35.68 45.44 35.28 45.14 34.96 44.83 C34.64 44.53 34.41 44.22 34.26 43.92 C34.11 43.61 34.10 43.15 34.07 43.00" stroke="url(#fmGloss)" stroke-width="1.7" stroke-opacity=".55"/>
      </g>

      <path d="M44.6 22.0 V81 C44.6 85.4 42.0 87.4 38.8 86.8" stroke="#2E3A46" stroke-opacity=".32" stroke-width="8.1"/>
      <path d="M44.6 22.0 V81 C44.6 85.4 42.0 87.4 38.8 86.8" stroke="url(#fmRod)" stroke-width="6.75"/>

      <path d="M35.24 65.00 C35.26 64.85 35.23 64.39 35.34 64.08 C35.45 63.78 35.63 63.47 35.90 63.17 C36.16 62.86 36.50 62.56 36.93 62.25 C37.36 61.94 37.85 61.64 38.47 61.33 C39.09 61.03 39.62 60.72 40.64 60.42 C41.66 60.11 43.27 59.81 44.60 59.50 C45.93 59.19 47.58 58.89 48.64 58.58 C49.71 58.28 50.30 57.97 50.98 57.67 C51.67 57.36 52.24 57.06 52.75 56.75 C53.26 56.44 53.68 56.14 54.03 55.83 C54.37 55.53 54.64 55.22 54.82 54.92 C55.01 54.61 55.08 54.15 55.13 54.00" stroke="#2E3A46" stroke-opacity=".32" stroke-width="8.1"/>
      <path d="M35.24 65.00 C35.26 64.85 35.23 64.39 35.34 64.08 C35.45 63.78 35.63 63.47 35.90 63.17 C36.16 62.86 36.50 62.56 36.93 62.25 C37.36 61.94 37.85 61.64 38.47 61.33 C39.09 61.03 39.62 60.72 40.64 60.42 C41.66 60.11 43.27 59.81 44.60 59.50 C45.93 59.19 47.58 58.89 48.64 58.58 C49.71 58.28 50.30 57.97 50.98 57.67 C51.67 57.36 52.24 57.06 52.75 56.75 C53.26 56.44 53.68 56.14 54.03 55.83 C54.37 55.53 54.64 55.22 54.82 54.92 C55.01 54.61 55.08 54.15 55.13 54.00" stroke="url(#fmBone)" stroke-width="6.75"/>
      <path d="M34.07 43.00 C34.12 42.85 34.19 42.39 34.38 42.08 C34.56 41.78 34.83 41.47 35.17 41.17 C35.52 40.86 35.94 40.56 36.45 40.25 C36.96 39.94 37.53 39.64 38.22 39.33 C38.90 39.03 39.49 38.72 40.56 38.42 C41.62 38.11 43.27 37.81 44.60 37.50 C45.93 37.19 47.54 36.89 48.56 36.58 C49.58 36.28 50.11 35.97 50.73 35.67 C51.35 35.36 51.84 35.06 52.27 34.75 C52.70 34.44 53.04 34.14 53.30 33.83 C53.57 33.53 53.75 33.22 53.86 32.92 C53.97 32.61 53.94 32.15 53.96 32.00" stroke="#2E3A46" stroke-opacity=".32" stroke-width="8.1"/>
      <path d="M34.07 43.00 C34.12 42.85 34.19 42.39 34.38 42.08 C34.56 41.78 34.83 41.47 35.17 41.17 C35.52 40.86 35.94 40.56 36.45 40.25 C36.96 39.94 37.53 39.64 38.22 39.33 C38.90 39.03 39.49 38.72 40.56 38.42 C41.62 38.11 43.27 37.81 44.60 37.50 C45.93 37.19 47.54 36.89 48.56 36.58 C49.58 36.28 50.11 35.97 50.73 35.67 C51.35 35.36 51.84 35.06 52.27 34.75 C52.70 34.44 53.04 34.14 53.30 33.83 C53.57 33.53 53.75 33.22 53.86 32.92 C53.97 32.61 53.94 32.15 53.96 32.00" stroke="url(#fmBone)" stroke-width="6.75"/>
