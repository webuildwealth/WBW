# =============================================================================
#  finanz-medizin.com — Netlify
#  Statische Auslieferung ohne Build-Schritt.
# =============================================================================

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Die Function importiert lib/lead-core.js von ausserhalb ihres Verzeichnisses.
# Ohne diese beiden Angaben landet die Datei nicht im Function-Bundle und der
# Aufruf schlaegt zur Laufzeit fehl.
[functions]
  node_bundler = "esbuild"
  included_files = ["lib/**"]

# Post-Processing vollständig aus. Wichtig aus zwei Gründen:
#  1. „Pretty URLs" würde /seite.html auf /seite umleiten — die canonical-Tags
#     zeigen aber auf die .html-Variante. Das gäbe widersprüchliche SEO-Signale.
#  2. Die Asset-Optimierung soll CSS und JS nicht anfassen; beides ist bereits
#     handoptimiert und der 3D-Renderer reagiert empfindlich auf Umformungen.
[build.processing]
  skip_processing = true

# -----------------------------------------------------------------------------
#  Sicherheits-Header
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

    # Die CSP musste für Consent-Management und Tracking geöffnet werden. Ohne
    # diese Hosts würden Cookiebot und der GTM-Container stillschweigend
    # blockiert — die Seite sähe unverändert aus, es liefe nur nichts.
    #
    # Aufgenommen ist ausschließlich, was die eingebauten Dienste brauchen:
    #   consent./consentcdn./imgsec.cookiebot.com  Banner, Prüfung, Deklaration
    #   www.googletagmanager.com                   Container + noscript-iframe
    #   *.google-analytics.com / *.analytics.google.com   GA4 über den GTM
    #   *.clarity.ms / c.bing.com                  Microsoft Clarity über den GTM
    # Clarity und GA4 stehen hier, weil sie später als Tag im GTM aktiviert
    # werden. Bis dahin wird nichts davon geladen — Cookiebot blockiert sie,
    # und die CSP erlaubt nur, sie verbietet nichts von selbst.
    #
    # 'unsafe-eval' ist bewusst NICHT gesetzt. Der GTM-Vorschaumodus und manche
    # benutzerdefinierten Vorlagen brauchen es; falls die Vorschau leer bleibt,
    # steht in SETUP.md, was dann zu tun ist.
    #
    # Der Funnel sendet an /api/lead auf derselben Domain; 'self' genügt dafür.
    Content-Security-Policy = """\
default-src 'self'; \
script-src 'self' 'unsafe-inline' https://consent.cookiebot.com https://consentcdn.cookiebot.com https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms; \
style-src 'self' 'unsafe-inline' https://consent.cookiebot.com https://consentcdn.cookiebot.com; \
font-src 'self' data:; \
img-src 'self' data: https://imgsec.cookiebot.com https://consent.cookiebot.com https://www.googletagmanager.com https://www.google-analytics.com https://*.clarity.ms https://c.bing.com; \
connect-src 'self' https://consent.cookiebot.com https://consentcdn.cookiebot.com https://www.googletagmanager.com https://www.google-analytics.com https://*.analytics.google.com https://*.clarity.ms https://c.bing.com; \
frame-src https://consentcdn.cookiebot.com https://www.googletagmanager.com; \
form-action 'self'; \
base-uri 'self'; \
frame-ancestors 'none'; \
object-src 'none'\
"""

# -----------------------------------------------------------------------------
#  Caching
#  Die Assets tragen keinen Content-Hash im Dateinamen. Deshalb bekommen CSS und
#  JS bewusst kein langes max-age: Netlify liefert ETags, ein Reload kostet also
#  nur ein 304 — dafür ist nach einem Deploy garantiert die neue Fassung aktiv.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# -----------------------------------------------------------------------------
#  Funnel-Endpunkt. Rewrite mit Status 200, nicht 301 — ein Redirect würde den
#  POST-Body verlieren.
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
  force = true

[[redirects]]
  from = "/api/slots"
  to = "/.netlify/functions/slots"
  status = 200
  force = true

[[redirects]]
  from = "/api/booking"
  to = "/.netlify/functions/booking"
  status = 200
  force = true

# -----------------------------------------------------------------------------
#  Bequeme Kurz-URLs für Anzeigen und Visitenkarten.
#  Ziel ist immer die .html-Variante, damit es genau eine kanonische Adresse gibt.
# -----------------------------------------------------------------------------
